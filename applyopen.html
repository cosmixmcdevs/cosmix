  <body>
    <header class="hero">
      <nav class="navbar">
        <a class="brand" href="home">CosmixMC</a>

          <a href="home">Home</a>

        <main>
            <section class="panel">
            <div class="page-header">
                <p class="eyebrow">Join the team!</p>
                <h1>Apply for staff</h1>
                <p>Fill out this form to apply for a staff position on the server.</p>
            </div>
    
            <div class="report-grid">
                <form id="apply-form">
                <label>
                    Your Minecraft username
                    <input name="username" type="text" placeholder="Example: Steve" required />
                </label>
                <label>
                    Your email address
                    <input name="email" type="email" placeholder="Example: yourusername@cosmixmc.org (use your actual email)" required />
                    <span class="error-message" id="email-error"></span>
                </label>
                <label>
                    Why do you want to join the staff team?
                    <textarea name="reason" placeholder="Explain your motivation and experience. At least 5 sentences." required></textarea> 
                </label>  
                <label>
                    What position are you applying for?
                    <select name="position" required>
                    <option value="">Select a position</option>
                    <option value="moderator">Moderator</option>
                    <option value="helper">Helper</option>
                    <option value="builder">Builder</option>
                    </select>
                </label>
                <button type="submit">Submit application</button>
                <p id="apply-status" style="margin: 0; color: #9fb0c8;"></p>
                </form>
            </div>
            </section>
        </main>
    </header>

    <script src="auth-controls.js"></script>
    <script>
      async function readJsonResponse(response) {
        const text = await response.text();
        if (!text) {
          return {};
        }

        try {
          return JSON.parse(text);
        } catch (error) {
          return { error: 'The server returned an unexpected response. Please refresh and try again.' };
        }
      }

      const applyForm = document.getElementById('apply-form');
      const applyStatus = document.getElementById('apply-status');

      if (applyForm && applyStatus) {
        applyForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          applyStatus.textContent = 'Submitting application...';
          applyStatus.style.color = '#9fb0c8';

          try {
            const response = await fetch('/api/application', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
              },
              body: new URLSearchParams(new FormData(applyForm)).toString(),
            });

            const data = await readJsonResponse(response);
            if (!response.ok) {
              throw new Error(data.error || 'Unable to submit your application right now.');
            }

            applyStatus.textContent = data.message || 'Application submitted successfully.';
            applyStatus.style.color = '#4ade80';
            applyForm.reset();
          } catch (error) {
            applyStatus.textContent = error.message || 'Unable to submit your application right now.';
            applyStatus.style.color = '#f87171';
          }
        });
      }
    </script>
