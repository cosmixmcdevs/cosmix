<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmix Web Server - Initialization Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0d12;
            color: #d1d5db;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal {
            width: 100%;
            max-width: 850px;
            background: #111827;
            border: 1px solid #374151;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 570px;
        }

        .terminal-header {
            background: #1f2937;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #374151;
        }

        .buttons {
            display: flex;
            gap: 6px;
            margin-right: 16px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .title {
            color: #9ca3af;
            font-size: 13px;
        }

        .console-body {
            flex-grow: 1;
            padding: 18px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }

        .console-body::-webkit-scrollbar {
            width: 6px;
        }
        .console-body::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }

        .line {
            white-space: pre-wrap;
            margin-bottom: 2px;
        }

        .cyan { color: #22d3ee; }
        .green { color: #4ade80; }
        .yellow { color: #fbbf24; }
        .magenta { color: #f472b6; }
        .dim { color: #6b7280; }
        .white { color: #ffffff; }

        .progress-track {
            display: inline-block;
            width: 150px;
            background: #374151;
            border-radius: 3px;
            height: 10px;
            vertical-align: middle;
            margin: 0 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #22d3ee;
            transition: width 0.05s linear;
        }

        .input-prompt-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .prompt-label {
            color: #4ade80;
            font-weight: bold;
            white-space: nowrap;
        }

        .cmd-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="terminal-header">
            <div class="buttons">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="title">node server.js — cosmix-web-server — 127.0.0.1</div>
        </div>
        <div class="console-body" id="console"></div>
    </div>
    <script>
        const output = document.getElementById('console');
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function log(text) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            return div;
        }

        async function logProgressBar(taskName, duration = 1000) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = `<span class="cyan">[INFO]</span> ${taskName} <div class="progress-track"><div class="progress-fill"></div></div> <span class="pct dim">0%</span>`;
            output.appendChild(div);

            const fill = div.querySelector('.progress-fill');
            const pct = div.querySelector('.pct');
            const steps = 10;

            for(let i = 1; i <= steps; i++) {
                await sleep(duration / steps);
                const percent = (i / steps) * 100;
                fill.style.width = `${percent}%`;
                pct.innerText = `${percent}%`;
                output.scrollTop = output.scrollHeight;
            }
            pct.className = 'green';
            pct.innerText = 'OK';
        }

        async function bootSequence() {
            log(`<span class="dim">$ npm run start</span>`);
            await sleep(400);
            log(`\n> cosmix-web-server@4.0.0 start\n> node dist/server.js\n`);
            await sleep(600);

            log(`<span class="cyan">[INFO]</span> <span class="white">Initializing Cosmix Engine architecture...</span>`);
            await sleep(350);
            log(`<span class="cyan">[INFO]</span> Loading configuration: <span class="magenta">.env.production</span>`);
            await sleep(250);
            log(`<span class="dim">[DEBUG] NODE_ENV=production</span>`);
            log(`<span class="dim">[DEBUG] PORT=8080</span>`);
            log(`<span class="dim">[DEBUG] COMPRESSION=enabled</span>`);
            await sleep(400);

            log(`<span class="cyan">[INFO]</span> Verifying core dependency ecosystem...`);
            await logProgressBar('Building module graph cache', 800);
            await logProgressBar('Compiling TypeScript schemas ', 1200);
            await sleep(300);

            log(`<span class="cyan">[INFO]</span> Connecting to persistence layers...`);
            await sleep(500);
            log(`<span class="green">[OK]</span>   Database pool connected successfully to cluster <span class="dim">(replica-set-0)</span>`);
            await sleep(250);
            log(`<span class="green">[OK]</span>   Redis cache engine linked on port 6379`);
            await sleep(400);

            log(`<span class="cyan">[INFO]</span> Mapping application server routing context tree...`);
            await sleep(300);
            log(`<span class="dim">  ➔ GET    /api/v1/health          [Anonymous]</span>`);
            await sleep(100);
            log(`<span class="dim">  ➔ GET    /api/v1/telemetry       [Protected]</span>`);
            await sleep(100);
            log(`<span class="dim">  ➔ POST   /api/v1/quantum-payload [Protected]</span>`);
            await sleep(150);
            log(`<span class="dim">  ➔ WS     /api/v1/stream/orbit     [Upgrade]</span>`);
            await sleep(400);
            log(`<span class="green">[OK]</span>   Compiled 24 active middleware controllers.`);
            await sleep(500);

            log(`\n<span class="green">✔ [READY] Cosmix HTTP Gateway execution loop initialized.</span>`);
            log(`<span class="dim">-------------------------------------------------------</span>`);
            log(`⚡ <span class="white">Server Listening URL:</span> <span class="cyan">https://cosmixmc.org:8080</span>`);
            log(`⚡ <span class="white">Process ID (PID):</span>     <span class="magenta">${Math.floor(Math.random() * 90000) + 10000}</span>`);
            log(`⚡ <span class="white">Cluster Instance:</span>    Worker-01 <span class="dim">(Thread Affinity: Core 0)</span>`);
            log(`<span class="dim">-------------------------------------------------------</span>\n`);
            
            log(`<span class="yellow">[NOTICE] To open Web Server, type the command 'cosmix run web'</span>\n`);
            await sleep(200);

            createInteractivePrompt();
        }

        function createInteractivePrompt() {
            const container = document.createElement('div');
            container.className = 'input-prompt-container';
            container.innerHTML = `
                <span class="prompt-label">user></span>
                <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false">
            `;
            output.appendChild(container);
            output.scrollTop = output.scrollHeight;

            const input = document.getElementById('cmdInput');
            
            output.addEventListener('click', () => input.focus());
            input.focus();

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const command = this.value.trim();
                    
                    container.remove();
                    log(`<span class="green">cosmix-server-io></span> <span class="white">${command}</span>`);

                    if (command === 'cosmix run web') {
                        log(`<span class="cyan">[INFO]</span> Launching user interface dashboard context...`);
                        log(`<span class="green">[OK]</span> Starting Web and taking user to it...`);
                        
                        setTimeout(() => {
                            window.location.href = 'home'; 
                        }, 800);
                    } else if (command === '') {
                        createInteractivePrompt();
                    } else {
                        log(`<span class="magenta">Error:</span> Command "${command}" not recognized. Clear gateway loop.`);
                        createInteractivePrompt();
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', bootSequence);
    </script>
</body>
</html>
