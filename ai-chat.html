<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CosmixMC | AI Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="navbar">
        <a class="brand" href="home">CosmixMC</a>
        <div class="nav-links">
          <a href="home">Home</a>
          <a href="ranks">Ranks</a>
          <a href="staff">Staff</a>
          <a href="server-status">Server Status</a>
          <a href="rules">Rules</a>
          <a href="apply">Apply</a>
          <a href="reports">Reports</a>
          <a href="clients">Eaglercraft</a>
          <a href="profile">Profile</a>
          <a href="plugins">Our Plugins</a>
          <a href="cosmixclient">Cosmix Client</a>
          <a href="ai-chat">AI Chat</a>
        </div>
        <div class="auth-controls" id="auth-controls"></div>
      </nav>

      <main>
        <section class="panel ai-chat-panel">
          <div class="page-header">
            <p class="eyebrow">Voidhaven AI</p>
            <h1>Ask anything.</h1>
            <p>A private assistant for questions, ideas, and quick help.</p>
          </div>

          <div class="ai-chat-window" id="chat-messages" aria-live="polite">
            <div class="ai-message assistant-message">
              <strong>CosmixAI</strong>
              <p id="ai-chat-greeting">Hey, i am CosmixAI! Ask me a question, or feel free to talk!</p>
            </div>
          </div>

          <form id="ai-chat-form" class="ai-chat-form">
            <label for="ai-chat-input">Message</label>
            <div class="ai-chat-composer">
              <textarea id="ai-chat-input" rows="2" maxlength="4000" placeholder="Ask Cosmix AI..." required></textarea>
              <button type="submit" id="ai-chat-submit">Send</button>
            </div>
            <p id="ai-chat-status" class="status-message" role="status"></p>
          </form>
        </section>
      </main>
    </header>

    <script src="auth-controls.js"></script>
  <script src="supabase-public-config.js"></script>
    <script>
      const form = document.getElementById('ai-chat-form');
      const input = document.getElementById('ai-chat-input');
      const submit = document.getElementById('ai-chat-submit');
      const status = document.getElementById('ai-chat-status');
      const messagesElement = document.getElementById('chat-messages');
      const messages = [];
      const supabaseConfig = window.COSMIX_SUPABASE_CONFIG || {};
      const currentUser = window.getCurrentUser?.();
      const greeting = document.getElementById('ai-chat-greeting');
      if (currentUser?.username && greeting) {
        greeting.textContent = `Hey, ${currentUser.username}, my name is CosmixAI. Ask me anything. I know everything. I can help you with your questions, ideas, and quick help. Just ask!`;
      }

      function appendMessage(role, text) {
        const message = document.createElement('div');
        message.className = `ai-message ${role}-message`;
        const heading = document.createElement('strong');
        heading.textContent = role === 'user' ? 'You' : 'CosmixAI';
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        message.append(heading, paragraph);
        messagesElement.appendChild(message);
        messagesElement.scrollTop = messagesElement.scrollHeight;
      }

      function addTypingIndicator() {
        const indicator = document.createElement('div');
        indicator.className = 'ai-message assistant-message ai-typing-indicator';
        indicator.setAttribute('role', 'status');
        indicator.setAttribute('aria-label', 'CosmixAI is thinking');
        indicator.innerHTML = '<strong>CosmixAI</strong><span class="typing-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>';
        messagesElement.appendChild(indicator);
        messagesElement.scrollTop = messagesElement.scrollHeight;
        return indicator;
      }

      async function readJsonResponse(response) {
        const text = await response.text();
        try {
          return text ? JSON.parse(text) : {};
        } catch (error) {
          if (response.headers.get('content-type')?.includes('text/html') || text.trimStart().startsWith('<')) {
            throw new Error('The AI chat service returned an HTML page instead of JSON. Check that the Node.js API service is running.');
          }
          throw new Error('The AI chat API returned an invalid response. Please try again later.');
        }
      }

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          if (!submit.disabled) form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const content = input.value.trim();
        if (!content) return;
        const requestStartedAt = Date.now();
        const thinkingDuration = 3000 + Math.random() * 5000;

        messages.push({ role: 'user', content });
        appendMessage('user', content);
        input.value = '';
        input.disabled = true;
        submit.disabled = true;
        status.textContent = '';
        const typingIndicator = addTypingIndicator();

        try {
          if (!supabaseConfig.url || !supabaseConfig.anonKey) {
            throw new Error('API error; report this to the maintainer of the model "Voidhaven 8.24 BETA" ');
          }

          const response = await fetch(`${supabaseConfig.url.replace(/\/$/, '')}/functions/v1/ai-chat`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
              apikey: supabaseConfig.anonKey,
              Authorization: `Bearer ${supabaseConfig.anonKey}`,
            },
            body: JSON.stringify({ messages }),
          });
          const result = await readJsonResponse(response);
          if (!response.ok) throw new Error(result.error || 'The AI chat is unavailable.');
          const remainingThinkTime = thinkingDuration - (Date.now() - requestStartedAt);
          if (remainingThinkTime > 0) {
            await new Promise((resolve) => setTimeout(resolve, remainingThinkTime));
          }
          typingIndicator.remove();
          messages.push({ role: 'assistant', content: result.reply });
          appendMessage('assistant', result.reply);
        } catch (error) {
          typingIndicator.remove();
          messages.pop();
          status.textContent = error.message;
        } finally {
          input.disabled = false;
          submit.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
